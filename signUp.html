<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 폼</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
}

.signup-wrapper {
    background: #ffffff;
    width: 500px; 
    padding: 50px 80px; 
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

h2 {
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 40px;
    color: #2d3748;
    letter-spacing: -0.5px;
}

.input-group {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}
.first,.last{
    margin-bottom: 0px;
}


.idCheck,.emailCheck{
    margin-left:85px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
}

.input-group label {
    width: 75px; 
    font-size: 14px;
    font-weight: 600;
    color: #4a5568;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
}

.input-group input {
    height: 50px;
    background-color: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 25px;
    padding: 0 20px;
    font-size: 15px;
    color: #2d3748;
    transition: all 0.3s ease;
}

.input-group input:focus {
    outline: none;
    border-color: #4299e1;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
}

.input-group input::placeholder {
    color: #a0aec0;
    font-size: 14px;
}

.id-flex-container {
    flex: 1;
    display: flex;
    gap: 8px;
    align-items: center;
}

.id-flex-container input {
    flex: 1; 
    width: auto;
}

.btn-check {
    height: 50px;
    padding: 0 15px; 
    background-color: #ffffff;
    color: #4a5568;
    border: 1px solid #cbd5e1;
    border-radius: 25px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease-in-out;
}

.btn-check:hover {
    background-color: #f1f5f9;
    border-color: #94a3b8;
    color: #1e293b;
}

.btn-check:active {
    background-color: #e2e8f0;
}

.signup-btn {
    width: 100%;
    height: 50px;
    margin-top: 15px;
    background-color: #4299e1;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

.signup-btn:hover {
    background-color: #3182ce;
}

.signup-btn:active {
    transform: scale(0.98);
}

.link-group {
    display: flex;
    justify-content: center;
    margin-top: 25px;
}

.link-group a {
    text-decoration: none;
    color: #718096;
    font-size: 14px;
    font-weight: 600;
    transition: color 0.2s ease;
}

.link-group a:hover {
    color: #4299e1; 
}
</style>
</head>
<body>

<div class="signup-wrapper">
    <h2>회원가입</h2>
    
    <form id="signupForm">
        <div class="input-group first">
            <label for="userid">ID</label>
            <div class="id-flex-container">
                <input type="text" id="userid" name="id" placeholder="아이디를 입력하세요" required>
                <button type="button" class="btn-check" id="idCheck">중복검사</button>
            </div>
        </div>

        <div class="input-group">
            <div class="idCheck"></div>
        </div>
        
        <div class="input-group">
            <label for="userpw">PW</label>
            <input type="password" id="userpw" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        
        <div class="input-group">
            <label for="userpw_confirm">PW 확인</label>
            <input type="password" id="userCheckPwd" name="checkPwd" placeholder="비밀번호를 다시 입력하세요" required>
        </div>
        
        <div class="input-group last">
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="email" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
            <div class="emailCheck"></div>
        </div>

        <button type="submit" class="signup-btn">가입하기</button> 
    </form>



    <div class="link-group">
        <a href="/loginpage">이미 계정이 있으신가요? 로그인</a>
    </div>
</div>

<script> 
    const signupForm = document.getElementById('signupForm');
    const userid = document.querySelector('#userid');
    const useremail = document.querySelector('#useremail');
    const idCheck = document.querySelector('.idCheck'); //아이디중복검사 텍스트태그 객체
    const emailCheck = document.querySelector('.emailCheck'); 
    let idCheckFlag = 0;
    
    signupForm.addEventListener('submit', async function(e) {

        e.preventDefault(); // 새로고침 차단

        // 입력된 폼 데이터 수집
        const formData = new FormData(signupForm); //form태그 입력값들을 name : value (키벨류)형태로 특수한바구니에 담는개념
        const data = Object.fromEntries(formData);  //일반 객체형태로 변환
        data.idCheckFlag = idCheckFlag; //객체에 아이디 중복플래그 키 벨류 추가

        try {
        //서버의 회원가입 API 주소로 데이터 전송 
        const response = await axios.post('/api/signup', data);

        // 서버 응답 처리
            //회원가입 성공
            if(response.data.success){
                alert('🎉 회원가입이 완료되었습니다!'); 
                //로그인 페이지로 이동
                window.location.href = '/loginpage'; 
            }else{
            //회원가입실패     
                alert(response.data.message); 
            }
        
        } catch (error) {
        //예외처리
            //회원가입 실패
            if(error.response) 
                alert("회원가입 실패!");
            console.error('에러 발생:', error);
            alert('서버와 통신 중 오류가 발생했습니다.');
        }
    });

    document.getElementById('idCheck').addEventListener("click",async () => {

        const data = {id : userid.value}

        try{
            const response = await axios.post('/api/idCheck', data);

            if(response.data.success){
                //아이디중복아님
                idCheck.textContent = response.data.message;
                idCheck.style.color = "green";
            }else{
                //아이디중복
                idCheck.textContent = response.data.message;
                idCheck.style.color = "red";
                idCheckFlag = 1; //중복이라는뜻
            }

        }catch(error){
            if(error.response) 
                alert("아이디중복검사 실패!");
            console.error('에러 발생:', error);
            alert('서버와 통신 중 오류가 발생했습니다.');
        }
        
    })


    //아이디정규식검사
    userid.addEventListener("input",() => {
        const idRegExp = /^[a-z0-9]{4,20}$/;

        const isValidId = idRegExp.test(userid.value);

        if(!isValidId){
            idCheck.textContent = "영문 소문자와 숫자를 조합해 4~12자리 아이디를 만들어주세요.";    
            idCheck.style.color = "red";
            if(userid.value == ""){
                idCheck.textContent = ""; 
            }
        }else{
            idCheck.textContent = "";    
        }
    })

    //이메일 정규식검사
    useremail.addEventListener("input",() => {
        const emailRegExp = /^[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*@[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*\.[a-zA-Z]{2,3}$/;

        const isValidId = emailRegExp.test(useremail.value);

        if(!isValidId){
            emailCheck.textContent = "이메일형식이 올바르지않습니다.";    
            emailCheck.style.color = "red";
            if(useremail.value == ""){
                emailCheck.textContent = ""; 
            }
        }else{
            emailCheck.textContent = "";    
        }
    })

</script>

</body>
</html>
