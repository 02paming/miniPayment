<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>결제하기</title>


    <style>
        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f5f5;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

        }


        .container {

            width: 90%;

            max-width: 450px;

            background: white;

            padding: 35px 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

        }


        h1 {

            text-align: center;

            margin-top: 0;

        }


        .product {

            padding: 20px;

            background: #f8f8f8;

            border-radius: 12px;

            margin: 25px 0;

        }


        .product-name {

            font-size: 18px;

            font-weight: bold;

        }


        .price {

            margin-top: 10px;

            font-size: 25px;

            font-weight: bold;

        }


        .payment-btn {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 10px;

            background: #222;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        .payment-btn:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        #result {

            margin-top: 20px;

            text-align: center;

            line-height: 1.6;

        }


        .success {

            color: #198754;

        }


        .error {

            color: #dc3545;

        }


        .logout {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #777;

            text-decoration: none;

        }
    </style>

</head>


<body>


    <div class="container">
        <h1>결제하기</h1>

        <div class="product">
            <div class="product_name" id="product_name">테스트 상품</div>
            <div><span class="price" id="price">10,000</span>원</div>
        </div>

        <button class="payment-btn" id="paymentBtn">결제하기</button>

        <div id="result"></div>

        <a href="/logout" class="logout">로그아웃</a>
    </div>

    <script>

        const savedData = sessionStorage.getItem('pendingPayment');

        if (savedData) {
            const { amount, name, points } = JSON.parse(savedData);
            // 프론트엔드 UI(텍스트 영역)에 데이터 반영하기 //포인트를 쓴 최종결제금액
            document.getElementById('price').innerText = `${amount - points}`;

            // 사용이 끝났다면 스토리지에서 삭제 (선택)
            sessionStorage.removeItem('pendingPayment');
        }


        const paymentBtn = document.getElementById('paymentBtn');
        const result = document.getElementById('result');
        // ==================================================
        // 로그인 상태 확인
        // ==================================================

        async function checkLogin() {
            try {

                const response =await fetch('/api/login-status');
                const data =await response.json();

                if (!data.loggedIn) {
                    alert('카카오 로그인이 필요합니다.');
                    window.location.href = '/';
                    return;
                }

                
                console.log('카카오 로그인 상태 확인 완료');


            } catch (error) {
                console.error(error);

                alert('로그인 상태를 확인할 수 없습니다.');
                window.location.href = '/';
            }

        }

        checkLogin();

        // ==================================================
        // 결제하기
        // ==================================================

        paymentBtn.addEventListener('click', async function () {

            paymentBtn.disabled = true;
            paymentBtn.textContent = '결제 처리 중...';
            result.textContent = '';

            try {
                // ------------------------------------------
                // 서버에 결제 요청
                // ------------------------------------------

                const response = await fetch('/api/payment',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                productName: document.getElementById('product_name').innerText, 
                                price: Number(document.getElementById('price').innerText) ,
                            })
                        }
                    );

                const data = await response.json();


                // ------------------------------------------
                // 성공
                // ------------------------------------------

                if (data.success) {
                    result.className = 'success';

                    result.innerHTML =
                        '✅ 결제가 완료되었습니다.<br>' +
                        '📱 카카오톡으로 알림을 보냈습니다.';

                    paymentBtn.textContent = '결제 완료';


                    alert('결제가 완료되었습니다.');
                    window.close(); // 현재 팝업창 닫기
                    return;

                }


                // ------------------------------------------
                // 실패
                // ------------------------------------------
                result.className = 'error';
                result.textContent = data.message || '결제에 실패했습니다.';


            } catch (error) {
                console.error(error);
                result.className = 'error';
                result.textContent = '서버 통신 중 오류가 발생했습니다.';


            } finally {

                if (!result.classList.contains('success')) {
                    paymentBtn.disabled = false;
                    paymentBtn.textContent = '결제하기';
                }
            }
        });

        

    </script>


</body>

</html>
