<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>카카오 로그인</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f5f5;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
        }

        .container {

            width: 90%;

            max-width: 400px;

            background: white;

            padding: 40px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);

        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #777;

            margin-bottom: 30px;
        }

        .kakao-btn {

            width: 100%;

            border: none;

            background: #FEE500;

            color: #000;

            padding: 16px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }

        .kakao-btn:hover {
            background: #f4dc00;
        }

    </style>

</head>


<body>


<div class="container">
    <h1>서비스 로그인</h1>
    <p>카카오 로그인 후 결제할 수 있습니다.</p>
    <button class="kakao-btn" id="kakaoLoginBtn">카카오 로그인</button>
</div>


<script>

    const kakaoLoginBtn = document.getElementById('kakaoLoginBtn');

    kakaoLoginBtn.addEventListener('click', function () {
        // 서버에서 카카오 로그인 URL을 만들어
        // 카카오 로그인 페이지로 이동시킴
    window.location.href = '/kakao-login';
    });

</script>


</body>

</html>
