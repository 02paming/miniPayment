<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 폼</title>
    
    <!-- 정상 작동하는 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 부트스트랩 아이콘 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 외부 라이브러리 스크립트 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
<style>
    /* 기본 리셋 및 폰트 설정 */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%) ; /* 부트스트랩 배경 덮어쓰기 방지 */
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 로그인 카드 컨테이너 */
    .login-wrapper {
        background: #ffffff;
        width: 380px;
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    /* 뒤로가기 */
    .login-wrapper .back{
        margin-top : -20px;
        margin-bottom : 40px;
        font-size: 25px;
    }
    
    .login-wrapper .back a :hover{
        color: #4299e1;
    }

    h2 {
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 40px;
        color: #2d3748;
        letter-spacing: -0.5px;
    }

    /* 입력 폼 그룹 */
    .input-group-custom {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
    }

    .input-group-custom label {
        width: 55px;
        font-size: 15px;
        font-weight: 600;
        color: #4a5568;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .input-group-custom input {
        flex: 1;
        height: 50px;
        background-color: #f7fafc;
        border: 1px solid #e2e8f0;
        border-radius: 25px;
        padding: 0 20px;
        font-size: 15px;
        color: #2d3748;
        transition: all 0.3s ease;
    }

    .input-group-custom input:focus {
        outline: none;
        border-color: #4299e1;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
    }
    
    .input-group-custom input::placeholder {
        color: #a0aec0;
        font-size: 14px;
    }

    /* 로그인 버튼 */
    .login-btn {
        width: 100%;
        height: 50px;
        margin-top: 10px;
        background-color: #4299e1;
        color: white;
        border: none;
        border-radius: 25px; 
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .login-btn:hover {
        background-color: #3182ce;
    }

    .login-btn:active {
        transform: scale(0.98); 
    }

    /* 하단 링크 그룹 */
    .link-group {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
    }

    .link-group a {
        text-decoration: none;
        color: #718096;
        font-size: 14px;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .link-group a:hover {
        color: #4299e1; 
    }
</style>
    
</head>
<body>

    <div class="login-wrapper">
        <div class="back">
            <a href="/" class="text-decoration-none text-secondary">
                <i class="bi bi-arrow-left"></i>
            </a>
        </div>
        <h2>로그인</h2>
        
        <form id="loginForm">
            <div class="input-group-custom">
                <label for="userid">ID</label>
                <input type="text" id="userid" name="id" placeholder="아이디를 입력하세요" autocomplete="off">
            </div>
            
            <div class="input-group-custom">
                <label for="userpw">PW</label>
                <input type="password" id="userpw" name="password" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="login-btn">로그인</button>
        </form>

        <div class="link-group">
            <a href="/signUp">회원가입</a>
        </div>
    </div>

    <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const formData = new FormData(loginForm); 
        const data = Object.fromEntries(formData);  

        try {
            const response = await axios.post('/api/login', data);
            alert('🎉 로그인이 완료되었습니다!'); 
            window.location.href = '/'
        } catch (error) {
            if(error.response)
                alert("로그인 실패!");
            console.error('에러 발생:', error);
        }
    });
    </script>
</body>
</html>
